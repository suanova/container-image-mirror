name: Sync images

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Manifest category under images/, or "all"'
        type: string
        default: all
      image:
        description: 'Only this image name (optional)'
        type: string
        default: ''
      tag:
        description: 'Only this tag (optional)'
        type: string
        default: ''
      dry_run:
        description: 'Plan only, do not push to the destination'
        type: boolean
        default: false
      scan:
        description: 'Run Trivy on each mirrored digest'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - images/**
      - config/**

# The job only reads the repository; it never writes back to GitHub.
permissions:
  contents: read

# Never run two syncs at once: two writers racing on the same tag would make
# digest verification fail in confusing ways.
concurrency:
  group: sync-images
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      categories: ${{ steps.detect.outputs.categories }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect categories
        id: detect
        env:
          INPUT_CATEGORY: ${{ inputs.category }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_CATEGORY:-}" && "${INPUT_CATEGORY}" != "all" ]]; then
            cats=$(printf '%s' "$INPUT_CATEGORY" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            cats=$(find images -maxdepth 1 -type f -name '*.yaml' \
              | sed 's|^images/||; s|\.yaml$||' | sort \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          if [[ "$cats" == "[]" ]]; then
            echo "::error::no manifest files found under images/"
            exit 1
          fi
          echo "categories=$cats" >>"$GITHUB_OUTPUT"

  sync:
    needs: plan
    runs-on: ubuntu-latest
    # Optional: attach protection rules (required reviewers) to this
    # environment so that pushes to Harbor are gated.
    environment: production
    strategy:
      fail-fast: false
      # One job per manifest file keeps logs readable and limits the blast
      # radius of a bad image to its own category.
      max-parallel: 3
      matrix:
        category: ${{ fromJSON(needs.plan.outputs.categories) }}
    env:
      MIRROR_USERNAME: ${{ vars.CI_BOT_NAME }}
      MIRROR_PASSWORD: ${{ secrets.CI_BOT_PASSWORD }}
      INPUT_IMAGE: ${{ inputs.image }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_SCAN: ${{ inputs.scan }}
      SYNC_RESULTS_FILE: ${{ github.workspace }}/.results/results-${{ matrix.category }}.jsonl
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo curl -fsSLo /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Install Trivy
        if: github.event_name == 'push' || inputs.scan == true
        run: |
          set -euo pipefail
          ./scripts/install-trivy.sh
          trivy --version

      - name: Install cosign
        # Signatures are verified before the copy, independently of scanning.
        if: inputs.dry_run != true
        uses: sigstore/cosign-installer@v3

      - name: Require credentials
        if: inputs.dry_run != true
        run: |
          if [[ -z "${MIRROR_USERNAME:-}" || -z "${MIRROR_PASSWORD:-}" ]]; then
            echo "::error::vars.CI_BOT_NAME and secrets.CI_BOT_PASSWORD must be configured (see docs/security.md)"
            exit 1
          fi

      - name: Sync ${{ matrix.category }}
        env:
          CATEGORY: ${{ matrix.category }}
        run: |
          set -euo pipefail
          args=(--category "$CATEGORY")
          if [[ -n "${INPUT_IMAGE:-}" ]]; then args+=(--image "$INPUT_IMAGE"); fi
          if [[ -n "${INPUT_TAG:-}" ]]; then args+=(--tag "$INPUT_TAG"); fi

          if [[ "${INPUT_DRY_RUN:-}" == "true" ]]; then
            args+=(--dry-run)
          elif [[ "$GITHUB_EVENT_NAME" == "push" || "${INPUT_SCAN:-}" == "true" ]]; then
            args+=(--scan)
          fi

          ./scripts/sync.sh "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-results-${{ matrix.category }}
          path: .results
          # upload-artifact skips dot-directories by default; .results is hidden.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  report:
    needs: [plan, sync]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: sync-results-*
          path: .results
          merge-multiple: true

      - name: Generate report
        run: ./scripts/generate-report.sh

  # Notify downstream consumers after a successful sync on main. Targets live in
  # vars.MIRROR_NOTIFY_TARGETS (JSON), so this public repository does not embed
  # product or private repository names.
  notify:
    needs: [plan, sync]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.sync.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    env:
      SUANOVA_BOT_CLIENT_ID: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
      SUANOVA_BOT_APP_PRIVATE_KEY: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
      MIRROR_NOTIFY_TARGETS: ${{ vars.MIRROR_NOTIFY_TARGETS }}
    steps:
      - name: Skip dispatch when notifications are not configured
        if: env.SUANOVA_BOT_CLIENT_ID == '' || env.SUANOVA_BOT_APP_PRIVATE_KEY == '' || env.MIRROR_NOTIFY_TARGETS == ''
        run: |
          echo "::warning::SUANOVA_BOT_CLIENT_ID / SUANOVA_BOT_APP_PRIVATE_KEY / MIRROR_NOTIFY_TARGETS are not configured; skipping mirror-updated dispatch"

      - name: Resolve notification targets
        id: targets
        if: env.SUANOVA_BOT_CLIENT_ID != '' && env.SUANOVA_BOT_APP_PRIVATE_KEY != '' && env.MIRROR_NOTIFY_TARGETS != ''
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' \
            <<<"${MIRROR_NOTIFY_TARGETS}" >/dev/null \
            || { echo "::error::MIRROR_NOTIFY_TARGETS must be a non-empty JSON array of repository names"; exit 1; }
          repos=$(jq -r 'unique | join(",")' <<<"${MIRROR_NOTIFY_TARGETS}")
          echo "repos=${repos}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app
        if: steps.targets.outputs.repos != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ env.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: ${{ steps.targets.outputs.repos }}
          permission-contents: write

      - name: Dispatch mirror-updated
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          jq -r 'unique[]' <<<"${MIRROR_NOTIFY_TARGETS}" | while IFS= read -r repo; do
            [ -n "${repo}" ] || continue
            payload=$(jq -n \
              --arg sha "$GITHUB_SHA" \
              --arg ref "$GITHUB_REF_NAME" \
              '{event_type: "mirror-updated",
                client_payload: {catalog_commit: $sha, ref: $ref}}')
            printf '%s' "$payload" | gh api --method POST "repos/${repo}/dispatches" --input -
            echo "dispatched mirror-updated to ${repo} at ${GITHUB_SHA}"
          done
