name: Update digests

# After a successful sync on main, fill missing target digests and open a PR.
# The sync workflow itself stays read-only; this job is the only writer and it
# never rewrites an existing pin (a mismatch is drift and fails the run).
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-digests.yaml
      - scripts/resolve-digests.sh
  workflow_dispatch:
    inputs:
      category:
        description: 'Manifest category under images/, or "all"'
        type: string
        default: all
  workflow_run:
    workflows: [Sync images, Scheduled sync]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: update-digests
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'schedule'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Install tools
        run: |
          set -euo pipefail
          sudo curl -fsSLo /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Fill missing digests
        env:
          CATEGORY: ${{ github.event.inputs.category || 'all' }}
          MIRROR_USERNAME: ${{ vars.CI_BOT_NAME }}
          MIRROR_PASSWORD: ${{ secrets.CI_BOT_PASSWORD }}
        run: |
          set -euo pipefail
          make digests ARGS="--category ${CATEGORY}"

      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: container-image-mirror
          permission-contents: write
          permission-pull-requests: write

      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app.outputs.token }}
          branch: chore/auto-digests
          base: main
          delete-branch: true
          add-paths: |
            images/*.yaml
            index.json
          title: "chore(digests): fill missing manifest digests"
          commit-message: "chore(digests): fill missing manifest digests"
          body: |
            The sync workflow mirrored new tags. This PR pins the target
            manifest digests for versions that did not have one yet.

            - digests are read from the mirrored target, not upstream;
            - existing pins are never rewritten; a mismatch fails the run;
            - `make index` was run, so `index.json` is included.
