apiVersion: mirror.suanova.io/v1alpha1
kind: ImageMirrorList
metadata:
  name: metax
  description: MetaX (沐曦) GPU operator images, migrated from Harbor's metax project.

spec:
  defaults:
    platforms:
      - linux/amd64
    # Vendor images use uncompressed OCI layers. Copy only the amd64 manifest so
    # Harbor does not rewrite the manifest list. Digest pins assert the amd64
    # manifest; the post-copy check compares source and target.
    multiarch: false
    # The first migration may find partially written target tags from an
    # interrupted run; allow replacing them. Subsequent runs skip equal digests.
    allowDigestReplace: true

  images:
    # 核心组件: metax-operator chart (0.15.3) 引用的 tag。无架构后缀的
    # 0.15.3 与带 amd64 后缀的 0.15.3-amd64 都镜像，二者指向同一个 amd64
    # manifest。
    - name: metax-gpu-label
      source: harbor.isuanova.com/metax/gpu-label
      target: harbor.isuanova.com/mirrors/cr.metax-tech.com/cloud/gpu-label
      versions:
        - tag: "0.15.3"
          digest: sha256:f30ba541cbb98a0dd628f7b449ab54c4ccab36298fdfbbe19effb7b4ec5df5f7
